[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sky-cotl-studio"
version = "0.1.0"
description = "Desktop tool for converting MP3 music to Sky: Children of the Light formats"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = '-m "not gpu"'
markers = ["gpu: optional integration test requiring the installed Transkun model"]

[tool.ruff]
target-version = "py311"
line-length = 100

[[tool.mypy.overrides]]
module = ["mido"]
ignore_missing_imports = true
